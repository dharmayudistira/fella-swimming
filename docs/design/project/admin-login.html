<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login — Fellaswimming Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --c-primary: oklch(0.71 0.14 230); --c-primary-dark: oklch(0.55 0.16 230); --c-primary-soft: oklch(0.71 0.14 230 / 0.10); --c-primary-tint: oklch(0.96 0.03 230);
    --c-secondary: oklch(0.73 0.13 184); --c-secondary-dark: oklch(0.55 0.13 184); --c-secondary-tint: oklch(0.96 0.03 184);
    --c-accent: oklch(0.72 0.16 15); --c-accent-dark: oklch(0.56 0.16 15);
    --c-sun: oklch(0.84 0.13 80);
    --c-bg: #FAF8F5; --c-surface: #FFFFFF; --c-muted: #F5F1EC; --c-border: #E7E2DA;
    --c-fg: #1A2332; --c-fg-muted: #5C6573; --c-fg-subtle: #8C95A3;
    --font-heading: "General Sans", "Nunito", system-ui, sans-serif;
    --font-body: "Nunito", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  body {
    font-family: var(--font-body); color: var(--c-fg); background: var(--c-bg);
    font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    position: relative; overflow-x: hidden;
  }
  body::before { content: ""; position: absolute; top: -120px; left: -120px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, oklch(0.92 0.06 230 / 0.5), transparent 70%); pointer-events: none; }
  body::after { content: ""; position: absolute; bottom: -120px; right: -120px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, oklch(0.92 0.06 80 / 0.4), transparent 70%); pointer-events: none; }
  h1, h2, h3 { font-family: var(--font-heading); font-weight: 700; line-height: 1.18; letter-spacing: -0.015em; margin: 0; }
  a { color: inherit; text-decoration: none; }

  .login {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 20px;
    position: relative; z-index: 1;
  }
  .login__card {
    width: 100%; max-width: 400px;
    background: var(--c-surface);
    border: 1.5px solid var(--c-border);
    border-bottom-width: 6px;
    border-bottom-color: var(--c-primary);
    border-radius: 24px;
    padding: 36px 32px 32px;
    box-shadow: 0 24px 48px -20px rgba(26,35,50,.12), 0 8px 16px -8px rgba(26,35,50,.06);
  }
  .login__logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-heading); font-weight: 700; font-size: 1.05rem;
    margin-bottom: 28px;
  }
  .login__logo-mark {
    width: 36px; height: 36px; border-radius: 12px;
    background: radial-gradient(circle at 28% 28%, oklch(0.92 0.07 200), var(--c-primary) 70%);
    box-shadow: 0 4px 10px -2px oklch(0.71 0.14 230 / 0.4);
    position: relative;
  }
  .login__logo-mark::after { content: ""; position: absolute; right: 5px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: oklch(0.95 0.04 80); }
  .login__logo small {
    margin-left: auto;
    font-family: var(--font-mono); font-size: 0.7rem;
    color: var(--c-fg-subtle); font-weight: 500;
    padding: 4px 9px; background: var(--c-muted); border-radius: 6px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  .login__title {
    font-size: 1.6rem;
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }
  .login__sub {
    color: var(--c-fg-muted);
    font-size: 0.94rem;
    margin-bottom: 24px;
  }

  .field { margin-bottom: 16px; }
  .field__label { display: block; font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; }
  .input {
    width: 100%;
    padding: 13px 14px;
    background: var(--c-surface);
    border: 1.5px solid var(--c-border);
    border-bottom-width: 3px;
    border-radius: 12px;
    font-family: var(--font-body);
    font-size: 0.98rem; font-weight: 500;
    color: var(--c-fg);
    outline: none; transition: border-color .15s;
  }
  .input::placeholder { color: var(--c-fg-subtle); font-weight: 400; }
  .input:focus { border-color: var(--c-primary); border-bottom-color: var(--c-primary); }
  .input.is-filled { border-bottom-color: var(--c-secondary); }
  .password-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .forgot { font-size: 0.84rem; color: var(--c-primary); font-weight: 600; }

  .btn {
    width: 100%;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 50px; padding: 0 22px;
    border-radius: 14px;
    font-family: var(--font-body); font-weight: 700;
    font-size: 0.98rem; cursor: pointer; border: none;
    background: var(--c-primary); color: #fff;
    box-shadow: 0 4px 0 0 var(--c-primary-dark), 0 8px 16px -6px oklch(0.71 0.14 230 / 0.4);
    transition: filter .15s, transform .08s;
    margin-top: 8px;
  }
  .btn:hover { filter: brightness(1.04); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 0 var(--c-primary-dark); }

  .login__hint {
    margin-top: 24px;
    padding: 14px 16px;
    background: var(--c-muted);
    border-radius: 12px;
    font-size: 0.86rem; color: var(--c-fg-muted);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .login__hint .ic {
    width: 24px; height: 24px; border-radius: 8px;
    background: var(--c-secondary-tint); color: var(--c-secondary-dark);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-family: var(--font-heading); font-weight: 800; font-size: 0.8rem;
  }
  .login__back {
    text-align: center;
    margin-top: 18px;
    font-size: 0.86rem; color: var(--c-fg-muted);
  }
  .login__back a { color: var(--c-fg); font-weight: 600; }
  .login__back a:hover { color: var(--c-primary); }
</style>
</head>
<body>

<main class="login">
  <div class="login__card">
    <div class="login__logo">
      <span class="login__logo-mark" aria-hidden="true"></span>
      <span>Fellaswimming</span>
      <small>Admin</small>
    </div>

    <h1 class="login__title">Selamat datang kembali, Bu Sari.</h1>
    <p class="login__sub">Masuk untuk lihat pendaftaran terbaru dan kelola artikel.</p>

    <form>
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="input is-filled" id="email" type="email" value="sari@fellaswimming.com" autocomplete="off" />
      </div>

      <div class="field">
        <div class="password-row">
          <label class="field__label" for="password">Password</label>
          <a class="forgot" href="#">Lupa password?</a>
        </div>
        <input class="input is-filled" id="password" type="password" value="••••••••••" />
      </div>

      <button class="btn" type="button">
        Masuk
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
    </form>

    <div class="login__hint">
      <span class="ic">i</span>
      <div>
        Akses admin hanya untuk tim Fellaswimming. Ortu yang mau daftar les renang, <a href="#" style="color:var(--c-primary); font-weight:700;">daftar di sini</a>.
      </div>
    </div>
  </div>
</main>

</body>
</html>
