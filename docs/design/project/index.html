  /* Frame chrome for the artboards */
  .frame { background: #FAF8F5; border-radius: 6px; overflow: hidden; }
  .frame iframe { display: block; border: 0; width: 100%; }
  .device-bar {
    height: 28px; display: flex; align-items: center; gap: 6px;
    padding: 0 14px; background: #1A2332; color: #fff;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.04em;
    border-radius: 6px 6px 0 0;
  }
  .device-bar .dots { display: flex; gap: 5px; }
  .device-bar .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .device-bar .url { opacity: 0.7; margin-left: 8px; }
  .device-bar .right { margin-left: auto; opacity: 0.5; }
</style>

// An artboard whose inner iframe height is measured after load so the
// artboard fits the entire landing page with no scrolling within it.
function LandingFrame({ src, width, height, deviceLabel, urlLabel }) {
  const barHeight = 28;
  return (
    <div className="frame" style={{ width, height: height + barHeight }}>
      <div className="device-bar">
        <div className="dots"><span className="dot"/><span className="dot"/><span className="dot"/></div>
        <span>{deviceLabel}</span>
        <span className="url">· {urlLabel}</span>
        <span className="right">{width}px</span>
      </div>
      <iframe
        src={src}
        style={{ height, width: '100%' }}
        scrolling="no"
        title={`landing-${width}`}
      />
    </div>
  );
}
